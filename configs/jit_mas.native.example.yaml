backend: native_jit
unsafe_local: false
max_agents: 4
max_parallel: 2
team_max_calls: 16
# Shared ceiling only: each task-execution role is called at most once.
max_model_calls: 100
max_total_tokens: 2000000
max_tool_calls: 64
candidates: 1
max_repairs: 2
# Repairs apply only before any execution-role model invocation starts.
local_planning: true
local_rounds: 1  # Pre-execution planning, not task-execution dialogue.
local_attribution: true
persistent_experience: true
evolving_agent_pool: true
available_tools: [web_search, crawl_page]
# Evolution/stream updates are persisted directly after attribution.
models:
  meta:
    model: ${MAS_META_MODEL}
    endpoint: ${MAS_META_ENDPOINT}
    key_env: MAS_META_API_KEY
    max_tokens: 64000
    timeout: 300
  global:
    model: ${MAS_GLOBAL_MODEL}
    endpoint: ${MAS_GLOBAL_ENDPOINT}
    key_env: MAS_GLOBAL_API_KEY
    max_tokens: 8192
    timeout: 120
  local:
    model: ${MAS_LOCAL_MODEL}
    endpoint: ${MAS_LOCAL_ENDPOINT}
    key_env: MAS_LOCAL_API_KEY
    max_tokens: 4096
    timeout: 120
  exec:
    model: ${MAS_EXEC_MODEL}
    endpoint: ${MAS_EXEC_ENDPOINT}
    key_env: MAS_EXEC_API_KEY
    max_tokens: 4096
    timeout: 120
  judge:
    model: ${MAS_JUDGE_MODEL}
    endpoint: ${MAS_JUDGE_ENDPOINT}
    key_env: MAS_JUDGE_API_KEY
    max_tokens: 4096
    timeout: 120
